# Builds, notarizes and publishes a GitHub Release when a version tag (v0.1.0, v1.2.3...) is pushed.
#
# Repository secrets required:
#   DEVELOPER_ID_CERTIFICATE_BASE64  Developer ID Application certificate exported as .p12, base64-encoded
#   DEVELOPER_ID_CERTIFICATE_PASSWORD  Password of that .p12
#   APPLE_TEAM_ID                    Apple team ID that owns the certificate
#   NOTARY_KEY_ID                    App Store Connect API key ID
#   NOTARY_ISSUER_ID                 App Store Connect API issuer ID
#   NOTARY_KEY_BASE64                The API private key (.p8), base64-encoded
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer" && xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build, notarize and staple
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail
          export NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          scripts/release.sh "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"
          rm "$NOTARY_KEY_PATH"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Remora $VERSION" \
            --generate-notes \
            dist/Remora-"$VERSION".zip \
            dist/Remora-"$VERSION".zip.sha256

      - name: Remove keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
